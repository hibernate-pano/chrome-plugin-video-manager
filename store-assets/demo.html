<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Demo Player</title>
  <style>
    body {
      margin: 0;
      background: #0b1220;
      font-family: Inter, -apple-system, "Segoe UI", system-ui, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .page-title {
      color: #94a3b8;
      font-size: 14px;
      letter-spacing: 0.06em;
    }
    .player {
      width: 960px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55);
    }
    video {
      width: 960px;
      height: 540px;
      display: block;
      background: linear-gradient(135deg, #14532d 0%, #052e16 45%, #0f172a 100%);
    }
  </style>
</head>
<body>
  <p class="page-title">示例页面 · 在线课程视频</p>
  <div class="player">
    <!-- poster 用内联 SVG 渐变模拟"视频画面"：全屏时 background 被强制为黑，
         只有 poster 能撑住画面内容，让商店截图不至于全黑。 -->
    <video id="demo-video" poster="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='960' height='540'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%2314532d'/><stop offset='0.45' stop-color='%23052e16'/><stop offset='1' stop-color='%230f172a'/></linearGradient></defs><rect width='960' height='540' fill='url(%23g)'/><text x='480' y='270' fill='%2394a3b8' font-family='sans-serif' font-size='28' text-anchor='middle'>在线课程 · 第 12 讲</text></svg>"></video>
  </div>
  <!-- 模拟一个播放中的视频：让全屏控制条能显示真实进度/时间。 -->
  <script>
    const v = document.getElementById('demo-video');
    let t = 1104; // 18:24
    Object.defineProperty(v, 'duration', { get: () => 2630, configurable: true }); // 43:50
    Object.defineProperty(v, 'currentTime', {
      get: () => t,
      set: (x) => { t = x; },
      configurable: true,
    });
    Object.defineProperty(v, 'paused', { get: () => false, configurable: true });
    Object.defineProperty(v, 'readyState', { get: () => 4, configurable: true });
    Object.defineProperty(v, 'play', { value: () => Promise.resolve(), configurable: true });
  </script>
  <script type="module" src="../../dist/content.js"></script>
</body>
</html>
