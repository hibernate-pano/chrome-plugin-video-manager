<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Speed Controller Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .video-container {
      margin: 20px 0;
    }
    input[type="text"] {
      padding: 8px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>Video Speed Controller Test Page</h1>
  
  <div class="video-container">
    <video id="test-video" width="640" height="360" controls>
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  
  <div class="video-container">
    <video id="test-video-2" width="320" height="240" controls>
      <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
    </video>
  </div>
  
  <div>
    <label for="test-input">Test Input:</label>
    <input type="text" id="test-input" placeholder="Type here to test keyboard blocking">
  </div>
  
  <script src="../../dist/content-bundled.js"></script>
</body>
</html>
