# Codecov 配置文件
# https://docs.codecov.com/docs/codecov-yaml

# 覆盖率配置
coverage:
  # 精度（小数位数）
  precision: 2

  # 舍入方式
  round: down

  # 范围（最小和最大百分比）
  range: "70...100"

  # 状态检查
  status:
    # 项目级别的覆盖率
    project:
      default:
        # 目标覆盖率
        target: 80%
        # 允许的覆盖率下降
        threshold: 1%
        # 基准分支
        base: auto
        # 仅在覆盖率下降时失败
        if_ci_failed: error

    # 补丁级别的覆盖率（仅针对 PR 中的新代码）
    patch:
      default:
        target: 80%
        threshold: 1%
        if_ci_failed: error

  # 变更检测
  changes:
    default:
      # 仅在覆盖率变化超过 0.5% 时报告
      threshold: 0.5%

# 注释配置
comment:
  # 在 PR 中添加注释
  layout: "reach,diff,flags,tree,footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# 忽略的文件和目录
ignore:
  - "**/__tests__/**"
  - "**/tests/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/*.d.ts"
  - "**/*.config.*"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/coverage/**"
  - "**/coverage-jest/**"
  - "**/*.md"
  - "**/scripts/**"
  - "**/playwright-report/**"

# 标志配置（用于区分不同的测试套件）
flags:
  vitest:
    paths:
      - src-react/shared/
      - src-react/content/
      - src-react/options/
    carryforward: true

  jest:
    paths:
      - src-react/shared/
      - src-react/background/
    carryforward: true

  merged:
    carryforward: true

  release:
    carryforward: true

# 通知配置
github_checks:
  annotations: true
