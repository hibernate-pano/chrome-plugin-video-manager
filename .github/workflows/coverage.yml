name: Coverage Report

# 触发条件
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # 每天 UTC 时间 0:00 运行
    - cron: '0 0 * * *'

# 环境变量
env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # 生成覆盖率报告
  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: 'src-react/pnpm-lock.yaml'

      - name: Install dependencies
        run: |
          cd src-react
          pnpm install --frozen-lockfile

      - name: Run Vitest tests with coverage
        run: |
          cd src-react
          pnpm test:coverage

      - name: Run Jest tests with coverage
        run: |
          cd src-react
          pnpm test:jest:coverage

      - name: Merge coverage reports
        run: |
          cd src-react
          # 创建合并后的覆盖率目录
          mkdir -p coverage-merged

          # 复制 Vitest 覆盖率
          if [ -f coverage/lcov.info ]; then
            cp coverage/lcov.info coverage-merged/vitest-lcov.info
          fi

          # 复制 Jest 覆盖率
          if [ -f coverage-jest/lcov.info ]; then
            cp coverage-jest/lcov.info coverage-merged/jest-lcov.info
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./src-react/coverage-merged/
          flags: merged
          name: merged-coverage
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Generate coverage badge
        run: |
          cd src-react

          # 从 Vitest 覆盖率中提取总体覆盖率
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;
              const lines = total.lines.pct;
              console.log(Math.round(lines));
            ")

            echo "Total coverage: ${COVERAGE}%"
            echo "COVERAGE=${COVERAGE}" >> $GITHUB_ENV
          fi

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // 读取 Vitest 覆盖率摘要
            let vitestSummary = '';
            try {
              const vitestCoverage = JSON.parse(
                fs.readFileSync('src-react/coverage/coverage-summary.json', 'utf8')
              );
              const total = vitestCoverage.total;
              vitestSummary = `
              | Metric | Coverage |
              |--------|----------|
              | Lines | ${total.lines.pct}% |
              | Statements | ${total.statements.pct}% |
              | Functions | ${total.functions.pct}% |
              | Branches | ${total.branches.pct}% |
              `;
            } catch (e) {
              vitestSummary = 'Coverage data not available';
            }

            // 读取 Jest 覆盖率摘要
            let jestSummary = '';
            try {
              const jestCoverage = JSON.parse(
                fs.readFileSync('src-react/coverage-jest/coverage-summary.json', 'utf8')
              );
              const total = jestCoverage.total;
              jestSummary = `
              | Metric | Coverage |
              |--------|----------|
              | Lines | ${total.lines.pct}% |
              | Statements | ${total.statements.pct}% |
              | Functions | ${total.functions.pct}% |
              | Branches | ${total.branches.pct}% |
              `;
            } catch (e) {
              jestSummary = 'Coverage data not available';
            }

            const comment = `
            ## 📊 Coverage Report

            ### Vitest (React Components)
            ${vitestSummary}

            ### Jest (Chrome API & Core Logic)
            ${jestSummary}

            [View full report on Codecov](https://codecov.io/gh/${{ github.repository }}/pull/${{ github.event.pull_request.number }})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            src-react/coverage/
            src-react/coverage-jest/
          retention-days: 30

      - name: Check coverage thresholds
        run: |
          cd src-react

          # 检查 Vitest 覆盖率是否达到阈值
          if [ -f coverage/coverage-summary.json ]; then
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const total = coverage.total;

              const threshold = 80;
              const metrics = ['lines', 'statements', 'functions', 'branches'];
              let failed = false;

              metrics.forEach(metric => {
                const pct = total[metric].pct;
                if (pct < threshold) {
                  console.error(\`❌ \${metric} coverage (\${pct}%) is below threshold (\${threshold}%)\`);
                  failed = true;
                } else {
                  console.log(\`✅ \${metric} coverage: \${pct}%\`);
                }
              });

              if (failed) {
                process.exit(1);
              }
            "
          fi
