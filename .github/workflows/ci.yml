name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Must run before setup-node: the pnpm cache step needs pnpm on PATH
      # to resolve the store directory.
      #
      # The version is pinned here rather than via a "packageManager" field in
      # package.json on purpose: pnpm 12 wants to record that field into
      # pnpm-lock.yaml, which turns `pnpm install --frozen-lockfile` into
      # ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE unless the lockfile is
      # regenerated. Pinning on the action keeps the lockfile untouched.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.6.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.6.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc` runs first here (package.json "build"), so type checking is
      # already gated by this job — there is no separate type-check step.
      - name: Build extension
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: extension-build
          # The whole dist/ tree: vite emits content.js, background.js,
          # options.js, chunks/ and options.html; scripts/copy-assets.js adds
          # manifest.json, content-loader.js, icons/ and _locales/.
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Real Extension E2E
    runs-on: ubuntu-latest
    # 单元测试跑的是 jsdom + chrome mock，覆盖不到 content-loader 的 document_start
    # 桥接、隔离世界和真实的 chrome.storage。这套用例真加载 dist/ 跑浏览器，
    # 它挂掉就说明扩展在真浏览器里已经不能用了，所以必须挡住。
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '12.6.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run real-extension e2e
        run: pnpm run test:e2e:ext

      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
