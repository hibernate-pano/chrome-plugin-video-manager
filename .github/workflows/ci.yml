name: CI/CD Pipeline

# ⚠️ push **不限定分支**：任何分支的每一次推送都要跑全套（包括真浏览器的
# e2e），否则「本地全绿」与「CI 会绿」就是两件事。
#
# 代价是每次推送多花约 2 分钟（e2e 要拉起真实 Chromium）。换来的是「绿色」
# 重新等于「真浏览器里还能用」—— 2026-10-21 之前的触发条件只认 main/develop，
# 于是 6.1.0 与 6.2.0 的全部工作（含 6 个新 e2e spec、重写过的设置页与
# 全屏控制器）**从未进过 CI**：最后一次绿的 e2e 作业还是 2026-10-08 跑的
# 6.0.8 那棵树。这条不变式由 scripts/ci-workflow.test.ts 守着。
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must run before setup-node: the pnpm cache step needs pnpm on PATH
      # to resolve the store directory.
      #
      # The version is pinned here rather than via a "packageManager" field in
      # package.json on purpose: pnpm 12 wants to record that field into
      # pnpm-lock.yaml, which turns `pnpm install --frozen-lockfile` into
      # ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE unless the lockfile is
      # regenerated. Pinning on the action keeps the lockfile untouched.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.6.0'

      # Node 24 是当前 Active LTS。此前钉的 20 已于 2026-04-30 EOL，
      # 且 setup-node v5+ / checkout v5+ / upload-artifact v6+ 自身就跑在 node24 上。
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.6.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `tsc` runs first here (package.json "build"), so type checking is
      # already gated by this job — there is no separate type-check step.
      - name: Build extension
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          # The whole dist/ tree: vite emits content.js, background.js,
          # options.js, chunks/ and options.html; scripts/copy-assets.js adds
          # manifest.json, content-loader.js, icons/ and _locales/.
          path: dist
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: Real Extension E2E
    runs-on: ubuntu-latest
    # 单元测试跑的是 jsdom + chrome mock，覆盖不到 content-loader 的 document_start
    # 桥接、隔离世界和真实的 chrome.storage。这套用例真加载 dist/ 跑浏览器，
    # 它挂掉就说明扩展在真浏览器里已经不能用了，所以必须挡住。
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '12.6.0'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        # ⚠️ 装进**项目内的私有缓存**，不是全局那一份。
        # 全局缓存是这台机器上所有项目共享的，而 Playwright 的
        # `_deleteStaleBrowsers` 会把「没有标记文件」的浏览器目录删掉 ——
        # 别的项目跑一次 install 就能把这里装好的浏览器清掉。
        # 私有缓存别人碰不到（GC 只扫全局注册表那一份）。
        # 详见 tests/e2e/helpers/launch.js 的说明。
        run: PLAYWRIGHT_BROWSERS_PATH=.cache/ms-playwright pnpm exec playwright install --with-deps chromium

      - name: Run real-extension e2e
        run: pnpm run test:e2e:ext

      - name: Upload e2e traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
