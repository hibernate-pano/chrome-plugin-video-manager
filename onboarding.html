<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>VideoSpeed Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      width: 360px;
      min-height: 480px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
    }
    
    /* Onboarding Container */
    .onboarding-container {
      padding: 24px;
      min-height: 480px;
      display: flex;
      flex-direction: column;
    }
    
    .onboarding-header {
      text-align: center;
      margin-bottom: 24px;
    }
    
    .onboarding-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .onboarding-title {
      font-size: 20px;
      font-weight: 700;
      color: white;
      margin-bottom: 4px;
    }
    
    .onboarding-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.8);
    }
    
    .onboarding-progress {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    
    .onboarding-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: all 0.3s;
    }
    
    .onboarding-dot.active {
      background: white;
      width: 24px;
      border-radius: 4px;
    }
    
    .onboarding-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    .onboarding-card-icon {
      font-size: 56px;
      margin-bottom: 16px;
    }
    
    .onboarding-card-title {
      font-size: 18px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }
    
    .onboarding-card-content {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
    }
    
    .onboarding-card-content code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
    }
    
    .onboarding-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    
    .onboarding-btn {
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
    }
    
    .onboarding-btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      flex: 1;
    }
    
    .onboarding-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102,126,234,0.4);
    }
    
    .onboarding-btn-secondary {
      background: #f5f5f5;
      color: #666;
    }
    
    .onboarding-btn-secondary:hover {
      background: #eee;
    }
    
    /* Changelog Styles */
    .changelog-container {
      background: white;
      border-radius: 16px;
      margin: 16px;
      max-height: 420px;
      overflow-y: auto;
    }
    
    .changelog-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }
    
    .changelog-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .changelog-version {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .changelog-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #999;
    }
    
    .changelog-item {
      padding: 16px 20px;
      border-bottom: 1px solid #f5f5f5;
    }
    
    .changelog-item:last-child {
      border-bottom: none;
    }
    
    .changelog-version-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .changelog-version-tag {
      background: #f0f0f0;
      color: #333;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .changelog-date {
      font-size: 12px;
      color: #999;
    }
    
    .changelog-features {
      list-style: none;
    }
    
    .changelog-features li {
      font-size: 13px;
      color: #666;
      padding: 4px 0;
      padding-left: 16px;
      position: relative;
    }
    
    .changelog-features li::before {
      content: '✓';
      position: absolute;
      left: 0;
      color: #10b981;
      font-weight: bold;
    }
    
    /* Skip link */
    .onboarding-skip {
      text-align: center;
      margin-top: 16px;
    }
    
    .onboarding-skip a {
      color: rgba(255,255,255,0.7);
      font-size: 13px;
      text-decoration: none;
    }
    
    .onboarding-skip a:hover {
      color: white;
    }
    
    .changelog-skip {
      text-align: center;
      padding: 16px;
      background: #f9f9f9;
    }
    
    .changelog-skip button {
      background: none;
      border: none;
      color: #666;
      font-size: 13px;
      cursor: pointer;
    }
    
    .changelog-skip button:hover {
      color: #333;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  
  <script type="module">
    // Onboarding data
    const CHANGELOG = [
      { version: '3.7.0', date: '2026-02-21', features: ['新增：入门引导和更新日志', '数字键1-4快速切换', '手势控制'] },
      { version: '3.6.0', date: '2026-02-21', features: ['Store发布材料', '快捷键管理工具'] },
      { version: '3.5.0', date: '2026-02-21', features: ['数字键快速切换', '手势控制'] },
      { version: '3.4.0', date: '2026-02-21', features: ['视频位置记忆'] },
      { version: '3.3.0', date: '2026-02-21', features: ['数据统计面板'] },
      { version: '3.2.0', date: '2026-02-21', features: ['云端同步'] }
    ];
    
    const ONBOARDING = [
      { icon: '⚡', title: '欢迎使用 VideoSpeed Pro!', content: '专为学习者打造的视频速度控制工具' },
      { icon: '⌨️', title: '快捷键控制', content: '<code>=</code> 加速 | <code>-</code> 减速 | <code>0</code> 重置 | <code>f</code> 全屏' },
      { icon: '🔢', title: '快速切换', content: '按 <code>1-4</code> 快速切换预设：1=学习 2=复习 3=浏览 4=听力' },
      { icon: '💎', title: 'Pro功能', content: '点击图标进入设置，解锁速度配置、历史记录、云同步等高级功能' }
    ];
    
    const CURRENT_VERSION = '3.7.0';
    const STORAGE_KEY = 'onboardingState';
    
    // App state
    let currentStep = 0;
    let mode = 'onboarding'; // 'onboarding' or 'changelog'
    
    // Render functions
    function renderOnboarding() {
      const step = ONBOARDING[currentStep];
      const progress = ONBOARDING.map((_, i) => 
        `<div class="onboarding-dot ${i === currentStep ? 'active' : ''}"></div>`
      ).join('');
      
      document.getElementById('app').innerHTML = `
        <div class="onboarding-container">
          <div class="onboarding-header">
            <div class="onboarding-icon">${step.icon}</div>
            <div class="onboarding-title">${step.title}</div>
            <div class="onboarding-subtitle">第 ${currentStep + 1} / ${ONBOARDING.length} 步</div>
          </div>
          
          <div class="onboarding-progress">${progress}</div>
          
          <div class="onboarding-card">
            <div class="onboarding-card-icon">${step.icon}</div>
            <div class="onboarding-card-title">${step.title}</div>
            <div class="onboarding-card-content">${step.content}</div>
            
            <div class="onboarding-actions">
              ${currentStep > 0 ? '<button class="onboarding-btn onboarding-btn-secondary" onclick="prevStep()">上一步</button>' : ''}
              <button class="onboarding-btn onboarding-btn-primary" onclick="nextStep()">
                ${currentStep === ONBOARDING.length - 1 ? '开始使用 →' : '下一步'}
              </button>
            </div>
          </div>
          
          <div class="onboarding-skip">
            <a href="#" onclick="skipOnboarding(event)">跳过引导</a>
          </div>
        </div>
      `;
    }
    
    function renderChangelog() {
      const items = CHANGELOG.map(item => `
        <div class="changelog-item">
          <div class="changelog-version-row">
            <span class="changelog-version-tag">v${item.version}</span>
            <span class="changelog-date">${item.date}</span>
          </div>
          <ul class="changelog-features">
            ${item.features.map(f => `<li>${f}</li>`).join('')}
          </ul>
        </div>
      `).join('');
      
      document.getElementById('app').innerHTML = `
        <div class="changelog-container">
          <div class="changelog-header">
            <div class="changelog-title">
              🆕 更新日志 <span class="changelog-version">v${CURRENT_VERSION}</span>
            </div>
          </div>
          ${items}
          <div class="changelog-skip">
            <button onclick="closeChangelog()">知道了，开始使用 →</button>
          </div>
        </div>
      `;
    }
    
    // Actions
    window.nextStep = function() {
      if (currentStep < ONBOARDING.length - 1) {
        currentStep++;
        renderOnboarding();
      } else {
        completeOnboarding();
      }
    };
    
    window.prevStep = function() {
      if (currentStep > 0) {
        currentStep--;
        renderOnboarding();
      }
    };
    
    window.skipOnboarding = function(e) {
      e.preventDefault();
      completeOnboarding();
    };
    
    window.closeChangelog = function() {
      chrome.storage.local.set({ [STORAGE_KEY]: { needsOnboarding: false, lastVersion: CURRENT_VERSION } });
      // Reload popup to show main app
      window.location.reload();
    };
    
    function completeOnboarding() {
      chrome.storage.local.set({ [STORAGE_KEY]: { needsOnboarding: false, lastVersion: CURRENT_VERSION } });
      renderChangelog();
    }
    
    // Init
    async function init() {
      const result = await chrome.storage.local.get(STORAGE_KEY);
      const state = result[STORAGE_KEY];
      
      if (state && !state.needsOnboarding && state.lastVersion === CURRENT_VERSION) {
        // Already seen onboarding, just close
        window.close();
        return;
      }
      
      if (state && state.lastVersion && state.lastVersion !== CURRENT_VERSION) {
        // Version changed, show changelog
        renderChangelog();
      } else {
        // Show onboarding
        renderOnboarding();
      }
    }
    
    init();
  </script>
</body>
</html>
